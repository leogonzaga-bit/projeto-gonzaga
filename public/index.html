<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal de Arquivos e Tarefas</title><style>
:root{font-family:Inter,system-ui,Arial;color:#202c3d;background:#f4f6f9}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;background:#183d65;color:white;border-radius:8px;padding:10px 14px}button.secondary{background:#e8eef5;color:#183d65}button.danger{background:#ad3c45}input,select,textarea{border:1px solid #ccd6e2;border-radius:7px;padding:10px;max-width:100%;background:white}h1{font-size:23px;margin:0}h2{font-size:18px}p{line-height:1.5}header{background:#102d4c;color:white;padding:18px 26px;display:flex;justify-content:space-between;gap:15px;align-items:center}header small{color:#bfd2e8}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 72px)}nav{background:white;border-right:1px solid #e4e8ef;padding:20px;display:flex;flex-direction:column;gap:9px}nav button{text-align:left;background:transparent;color:#274260}nav button.active{background:#e6eff9;color:#102d4c;font-weight:700}main{padding:28px;max-width:1300px;width:100%;margin:auto}.panel{background:white;border:1px solid #e4e8ef;padding:22px;border-radius:13px;margin-bottom:18px;box-shadow:0 3px 16px #0e315009}.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.muted{color:#65748a;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px;margin:9px 0}.field label{font-size:13px;font-weight:600}.table{width:100%;border-collapse:collapse;text-align:left}td,th{padding:11px;border-bottom:1px solid #eef1f5;font-size:14px}td button{padding:6px 10px;margin-right:5px}.pill{border-radius:99px;background:#e7edf4;padding:4px 9px;font-size:12px}#login{max-width:440px;margin:12vh auto}.hidden{display:none!important}#alert{padding:12px;border-radius:9px;background:#fff0eb;color:#9e3328;margin-bottom:15px;display:none}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{min-height:92px;border:1px solid #e0e6ee;border-radius:7px;padding:7px;font-size:12px;background:#fff}.day.has{background:#eff7ff}.day strong{display:block}.day button{display:block;width:100%;margin-top:4px;padding:3px;background:#dce9fa;color:#1b385d;text-align:left;font-size:11px;white-space:normal}.day.faded{opacity:.4}@media(max-width:740px){.layout{grid-template-columns:1fr}nav{display:flex;flex-direction:row;overflow:auto;padding:8px}main{padding:12px}header{padding:13px}.table{display:block;overflow:auto}.day{min-height:60px;padding:3px;font-size:10px}}
</style></head><body><div id="login" class="panel"><h1>Portal de arquivos</h1><p class="muted">Acesso seguro à documentação e às tarefas da equipe.</p><form id="loginForm"><div class="field"><label>E-mail</label><input name="email" type="email" required autocomplete="username"></div><div class="field"><label>Senha</label><input name="password" type="password" required autocomplete="current-password"></div><button>Entrar</button></form></div><div id="app" class="hidden"><header><div><h1>Portal de Arquivos e Tarefas</h1><small id="userLabel"></small></div><button class="secondary" id="logout">Sair</button></header><div class="layout"><nav id="nav"><button data-view="home" class="active">◈ Início</button><button data-view="files">▣ Arquivos</button><button data-view="trash">♻ Lixeira</button><button data-view="calendar">▦ Calendário</button><button data-view="tasks">☑ Minhas tarefas</button><button data-view="users" class="adminOnly">♙ Usuários</button><button data-view="audit" class="masterOnly">☷ Auditoria</button></nav><main><div id="alert"></div><section id="content"></section></main></div></div>
<script>
let me=null,view='home',parent=null,path=[],users=[],tasks=[],month=new Date();let base='';
const $=s=>document.querySelector(s), escapeHtml=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,options={}){let response=await fetch('/api'+url,{...options,headers:{...(options.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(options.headers||{})}});let data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error||'Erro de comunicação');return data}
const post=(url,data,method='POST')=>api(url,{method,body:JSON.stringify(data)});
function error(e){$('#alert').textContent=e.message||e;$('#alert').style.display='block';setTimeout(()=>$('#alert').style.display='none',7000)}
async function init(){try{me=await api('/me');$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#userLabel').textContent=me.name+' • '+({master:'Administrador Master',admin:'Administrador',user:'Usuário'}[me.role]);document.querySelectorAll('.adminOnly').forEach(x=>x.classList.toggle('hidden',me.role==='user'));document.querySelectorAll('.masterOnly').forEach(x=>x.classList.toggle('hidden',me.role!=='master'));await show('home')}catch{}}
$('#loginForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{await post('/login',Object.fromEntries(f));await init()}catch(err){alert(err.message)}};
$('#logout').onclick=async()=>{await post('/logout',{});location.reload()};
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>show(b.dataset.view));
async function show(v){view=v;$('#alert').style.display='none';document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));try{if(v==='home')await home();if(v==='files')await files();if(v==='trash')await trash();if(v==='calendar')await calendar();if(v==='tasks')await taskList();if(v==='users')await userList();if(v==='audit')await audit()}catch(e){error(e)}}
async function home(){tasks=await api('/tasks');let open=tasks.filter(t=>!t.completed), today=new Date().toLocaleDateString('en-CA');$('#content').innerHTML=`<h2>Painel inicial</h2><div class="grid"><div class="panel"><h2>${open.length}</h2><p>Tarefas pendentes</p></div><div class="panel"><h2>${open.filter(t=>t.due_date<today).length}</h2><p>Tarefas atrasadas</p></div><div class="panel"><h2>${open.filter(t=>t.due_date===today).length}</h2><p>Tarefas de hoje</p></div></div><div class="panel"><h2>Próximas tarefas</h2>${open.slice(0,8).map(t=>`<p>◻ ${escapeHtml(t.title)} <span class="muted">${t.due_date}</span></p>`).join('')||'Nenhuma tarefa pendente.'}<button onclick="show('tasks')">Abrir tarefas</button></div>`}
async function files(){const data=await api('/files'+(parent?'?parent='+encodeURIComponent(parent):''));$('#content').innerHTML=`<div class="flex between"><h2>Arquivos no Google Drive</h2><div class="flex"><button class="secondary" onclick="fileBack()">Voltar</button><button onclick="newFolder()">+ Pasta</button><button onclick="$('#fileInput').click()">+ Enviar arquivo</button><input type="file" id="fileInput" class="hidden" onchange="uploadFile(this)"></div></div><div class="panel"><p class="muted">${path.map(x=>escapeHtml(x.name)).join(' / ')||'Pastas autorizadas'}</p><table class="table"><thead><tr><th>Nome</th><th>Tipo</th><th>Ações</th></tr></thead><tbody>${data.files.map(f=>`<tr><td>${escapeHtml(f.name)}</td><td>${f.mimeType==='application/vnd.google-apps.folder'?'Pasta':'Documento'}</td><td>${f.mimeType==='application/vnd.google-apps.folder'?`<button class="secondary" onclick="openFolder('${f.id}',decodeURIComponent('${encodeURIComponent(f.name)}'))">Abrir</button>`:`<button class="secondary" onclick="downloadFile('${f.id}')">Baixar</button>`}<button class="danger" onclick="moveTrash('${f.id}')">Lixeira</button></td></tr>`).join('')}</tbody></table>${data.files.length?'':'<p>Nenhum arquivo disponível.</p>'}</div>`}
function openFolder(id,name){path.push({id,name});parent=id;files().catch(error)}function fileBack(){path.pop();parent=path.length?path.at(-1).id:null;files().catch(error)}
async function newFolder(){let name=prompt('Nome da nova pasta:');if(!name)return;try{await post('/folders',{name,parent});await files()}catch(e){error(e)}}
async function uploadFile(input){let file=input.files[0];if(!file)return;let form=new FormData();form.append('file',file);if(parent)form.append('parent',parent);try{await api('/upload',{method:'POST',body:form});await files()}catch(e){error(e)}}
function downloadFile(id){fetch('/api/download/'+id).then(async r=>{if(!r.ok)throw Error((await r.json()).error);let blob=await r.blob(),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='arquivo';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}).catch(error)}
async function moveTrash(id){if(!confirm('Mover para a lixeira do portal?'))return;try{await post('/trash/'+id,{});await files()}catch(e){error(e)}}
async function trash(){let list=await api('/trash');$('#content').innerHTML=`<h2>Lixeira recuperável</h2><div class="panel"><p class="muted">Arquivos ficam ocultos no portal, sem exclusão definitiva do Drive.</p><table class="table">${list.map(f=>`<tr><td>${escapeHtml(f.name)}</td><td>${f.deleted_at}</td><td><button onclick="restore('${f.file_id}')">Restaurar</button></td></tr>`).join('')}</table></div>`}
async function restore(id){try{await post('/restore/'+id,{});await trash()}catch(e){error(e)}}
async function loadTasks(){tasks=await api('/tasks')}
function taskForm(){return `<div class="panel"><h2>+ Nova tarefa</h2><form id="taskForm" class="grid"><div class="field"><label>Título</label><input name="title" required></div><div class="field"><label>Data de realização</label><input type="date" name="due_date" required></div><div class="field"><label>Detalhes</label><input name="details"></div>${me.role!=='user'?`<div class="field"><label>Responsável (ID, opcional)</label><input name="owner_id" type="number" min="1" placeholder="Meu usuário"></div>`:''}<div><button>Salvar tarefa</button></div></form></div>`}
function wireTaskForm(){let form=$('#taskForm');form.onsubmit=async e=>{e.preventDefault();try{await post('/tasks',Object.fromEntries(new FormData(form)));await show(view)}catch(err){error(err)}}}
async function taskList(){await loadTasks();$('#content').innerHTML='<h2>Quadro de tarefas</h2>'+taskForm()+`<div class="panel"><table class="table"><thead><tr><th>Feita</th><th>Tarefa</th><th>Data</th><th>Situação</th></tr></thead>${tasks.map(t=>`<tr><td><input type="checkbox" ${t.completed?'checked':''} onchange="checkTask(${t.id},this.checked)"></td><td>${escapeHtml(t.title)}<div class="muted">${escapeHtml(t.details)}</div></td><td>${t.due_date}</td><td><span class="pill">${t.completed?'Concluída':t.due_date<new Date().toLocaleDateString('en-CA')?'Atrasada':'Pendente'}</span></td></tr>`).join('')}</table></div>`;wireTaskForm()}
async function checkTask(id,completed){try{await post('/tasks/'+id,{completed},'PATCH');await show(view)}catch(e){error(e)}}
async function calendar(){await loadTasks();let y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();let days=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];let cells=Array.from({length:first},()=>'<div class="day faded"></div>');for(let i=1;i<=n;i++){let d=`${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`,ts=tasks.filter(t=>t.due_date===d);cells.push(`<div class="day ${ts.length?'has':''}"><strong>${i}</strong>${ts.map(t=>`<button title="${escapeHtml(t.details)}" onclick="show('tasks')">${t.completed?'✓':'•'} ${escapeHtml(t.title)}</button>`).join('')}</div>`)}$('#content').innerHTML=`<div class="flex between"><h2>Calendário • ${month.toLocaleString('pt-BR',{month:'long',year:'numeric'})}</h2><div><button class="secondary" onclick="changeMonth(-1)">‹</button> <button class="secondary" onclick="changeMonth(1)">›</button></div></div><div class="panel">${taskForm()}<div class="calendar">${days.map(d=>`<strong>${d}</strong>`).join('')}${cells.join('')}</div></div>`;wireTaskForm()}
function changeMonth(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);calendar().catch(error)}
async function userList(){users=await api('/users');$('#content').innerHTML=`<h2>Gestão de usuários</h2><div class="panel"><h2>+ Cadastrar usuário</h2><form id="userForm" class="grid"><div class="field"><label>Nome completo</label><input name="name" required></div><div class="field"><label>Telefone</label><input name="phone" required></div><div class="field"><label>E-mail</label><input type="email" name="email" required></div><div class="field"><label>Senha inicial (10+ caracteres)</label><input type="password" name="password" minlength="10" required></div><div class="field"><label>Nível</label><select name="role"><option value="user">Usuário comum</option><option value="admin">Administrador</option>${me.role==='master'?'<option value="master">Master</option>':''}</select></div><div class="field"><label>Função</label><select name="function">${['advogada','advogada parceira','estagiário','financeiro','colaborador','outro'].map(x=>`<option>${x}</option>`).join('')}</select></div><div><button>Cadastrar</button></div></form></div><div class="panel"><h2>Usuários cadastrados</h2><table class="table">${users.map(u=>`<tr><td>${escapeHtml(u.name)}<div class="muted">${escapeHtml(u.email)} • ${escapeHtml(u.phone)}</div></td><td>${escapeHtml(u.function)} / ${u.role}</td><td>${u.active?'Ativo':'Inativo'}</td><td>${u.role!=='master'?`<button class="secondary" onclick="grants(${u.id})">Pastas</button><button class="danger" onclick="toggleUser(${u.id},${u.active?0:1})">${u.active?'Desativar':'Reativar'}</button>`:''}</td></tr>`).join('')}</table></div>`;$('#userForm').onsubmit=async e=>{e.preventDefault();try{await post('/users',Object.fromEntries(new FormData(e.target)));await userList()}catch(err){error(err)}}}
async function toggleUser(id,active){if(!confirm('Confirmar alteração de acesso?'))return;try{await post('/users/'+id,{active},'PATCH');await userList()}catch(e){error(e)}}
async function grants(id){let current=await api('/grants/'+id);let ids=prompt('IDs de pastas autorizadas, separados por vírgula.\nCada pasta precisa estar dentro da raiz do Drive.\nDeixe em branco para remover acessos.',current.join(','));if(ids===null)return;try{await post('/grants/'+id,{folderIds:ids.split(',').map(s=>s.trim()).filter(Boolean)},'PUT');alert('Permissões atualizadas')}catch(e){error(e)}}
async function audit(){let entries=await api('/audit');$('#content').innerHTML=`<h2>Registro de auditoria — Master</h2><div class="panel"><table class="table"><thead><tr><th>Data</th><th>Usuário</th><th>Ação</th><th>Detalhes</th><th>IP</th></tr></thead>${entries.map(e=>`<tr><td>${e.created_at}</td><td>${escapeHtml(e.actor_email)}</td><td>${escapeHtml(e.action)}</td><td>${escapeHtml(e.detail)}</td><td>${escapeHtml(e.ip)}</td></tr>`).join('')}</table></div>`}
init();
</script></body></html>
